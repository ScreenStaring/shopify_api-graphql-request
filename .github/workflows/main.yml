name: CI

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_DOMAIN: "${{ secrets.SHOPIFY_DOMAIN }}"
      SHOPIFY_TOKEN: "${{ secrets.SHOPIFY_TOKEN }}"
      SHOPIFY_CUSTOMER_ID: "${{ secrets.SHOPIFY_CUSTOMER_ID }}"
      SHOPIFY_PRODUCT_ID: "${{ secrets.SHOPIFY_PRODUCT_ID }}"
      SHOPIFY_REFRESH_TOKEN: "${{ secrets.SHOPIFY_REFRESH_TOKEN }}"
      SHOPIFY_CLIENT_API_KEY: "${{ secrets.SHOPIFY_CLIENT_API_KEY }}"
      SHOPIFY_CLIENT_API_SECRET: "${{ secrets.SHOPIFY_CLIENT_API_SECRET }}"
      SHOPIFY_PRIVATE_KEY: "${{ secrets.SHOPIFY_PRIVATE_KEY }}"
      SHOPIFY_KEY_ID: "${{ secrets.SHOPIFY_KEY_ID }}"

    strategy:
      matrix:
        ruby: ['4.0', '3.4', '3.3', '3.2', '3.1', '3.0', '2.7']

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.4.22'

      - run: bundle install
      - run: bundle exec rake
